name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build backend and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (no frontend, tests on)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSTORA6E_BUILD_FRONTEND=OFF
          -DSTORA6E_BUILD_TESTS=ON

      - name: Build backend + tests
        run: cmake --build build --target stora6e stora6e_tests -j2

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

  frontend:
    name: Typecheck and build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build
